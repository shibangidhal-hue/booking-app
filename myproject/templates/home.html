
{% extends 'layouts/base.html' %}

{% block title %}Welcome to Roam India{% endblock %}

{% block extra_css %}
<style>
    .hero {
        min-height: 550px;
        background: #f7f5f0;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 30px 20px;
    }

    .welcome-content h1 {
        font-size: 48px;
        color: #292929;
        margin-bottom: 15px;
        font-weight: 700;
    }

    .welcome-content h1 span {
        color: #572ec7;
    }

    .welcome-content p {
        font-size: 18px;
        color: #777;
        margin-bottom: 25px;
    }

    .welcome-content a {
        display: inline-block;
        background: #382892;
        color: white;
        text-decoration: none;
        padding: 13px 32px;
        border-radius: 5px;
        font-weight: 600;
    }

    .welcome-content a:hover {
        background: #1e38aa;
    }

    @media(max-width: 600px) {
        .welcome-content h1 {
            font-size: 34px;
        }
    }
</style>
{% endblock %}

{% block content %}

<section class="hero">
    <div class="welcome-content">
        <h1>Welcome to <span>Roam India</span></h1>
        <p>Explore More. Travel Better.</p>
        <a href="#">Explore Now</a>
    </div>
</section>

{% endblock %}
